<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250"><style>.float{animation:f 6s ease-in-out infinite}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.dash{animation:d 3s linear infinite}@keyframes d{to{stroke-dashoffset:-36}}.twinkle{animation:t 2.4s ease-in-out infinite}@keyframes t{0%,100%{opacity:1}50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.float,.dash,.twinkle{animation:none}}</style><g class="float" style="animation-delay:0.0s"><rect x="2" y="10" width="302" height="230" rx="22" fill="#fff" stroke="#1D9A84" stroke-opacity=".35" stroke-width="2"/><rect x="2" y="10" width="302" height="10" rx="5" fill="#1D9A84"/><circle cx="54" cy="70" r="28" fill="#1D9A84"/><text x="54" y="80" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff">0</text><text x="96" y="80" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="22" font-weight="800" fill="#14231F">Planificación</text><text x="30" y="150" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">La venta real se vuelve</text><text x="30" y="176" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">pronóstico y órdenes de</text><text x="30" y="202" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">compra y producción</text></g><g class="float" style="animation-delay:0.4s"><rect x="326" y="10" width="302" height="230" rx="22" fill="#fff" stroke="#F2A541" stroke-opacity=".35" stroke-width="2"/><rect x="326" y="10" width="302" height="10" rx="5" fill="#F2A541"/><circle cx="378" cy="70" r="28" fill="#F2A541"/><text x="378" y="80" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff">1</text><text x="420" y="80" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="22" font-weight="800" fill="#14231F">Recepción</text><text x="354" y="150" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">Orden, recepción y factura</text><text x="354" y="176" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">por CDC: control de tres vías</text></g><g class="float" style="animation-delay:0.8s"><rect x="651" y="10" width="302" height="230" rx="22" fill="#fff" stroke="#E0457B" stroke-opacity=".35" stroke-width="2"/><rect x="651" y="10" width="302" height="10" rx="5" fill="#E0457B"/><circle cx="703" cy="70" r="28" fill="#E0457B"/><text x="703" y="80" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff">2</text><text x="745" y="80" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="22" font-weight="800" fill="#14231F">Producción</text><text x="679" y="150" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">Cada balde sale de la balanza</text><text x="679" y="176" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">con su código y su orden</text></g><g class="float" style="animation-delay:1.2s"><rect x="976" y="10" width="302" height="230" rx="22" fill="#fff" stroke="#6D5BD0" stroke-opacity=".35" stroke-width="2"/><rect x="976" y="10" width="302" height="10" rx="5" fill="#6D5BD0"/><circle cx="1028" cy="70" r="28" fill="#6D5BD0"/><text x="1028" y="80" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff">3</text><text x="1070" y="80" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="22" font-weight="800" fill="#14231F">Despacho</text><text x="1004" y="150" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">Pedido sugerido, factura y</text><text x="1004" y="176" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="18" fill="#3D4A47">remisión del mismo escaneo</text></g></svg>